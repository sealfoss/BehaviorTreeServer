[pytest]
# Run from the repository root: pytest bt_server_core/test bt_server_gateway/test ...
# The packages are importable without installing them.
pythonpath = bt_server_core bt_server_gateway bt_server_executor
testpaths = bt_server_core/test bt_server_gateway/test bt_server_executor/test tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    ros: needs ROS 2 (rclpy and the built bt_server_interfaces); skipped without them
    slow: takes more than a few seconds
    page: a browser test of the page (Playwright, Chromium); skipped without them
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:ament_xmllint
